<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="/images/zora_design_fav11.png" />

    <!-- Apply the route-specific theme before the first paint -->
    <script>
      (function () {
        const rawPath = window.location.pathname;
        const pathname =
          rawPath === "/" || rawPath.endsWith("/") ? rawPath : `${rawPath}/`;
        const cityPaths = new Set([
          "/webdesign/salzburg/",
          "/en-2/web-design/salzburg/",
          "/webdesign/graz/",
          "/en-2/web-design/graz/",
          "/webdesign/muenchen/",
          "/en-2/web-design/munich/",
        ]);
        const defaultTheme =
          pathname === "/webdesign/salzburg/" ? "dark" : "light";
        const storageKey = cityPaths.has(pathname)
          ? `site-theme:${pathname}`
          : "site-theme";
        const savedTheme = localStorage.getItem(storageKey);
        const selectedTheme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : defaultTheme;

        document.documentElement.classList.add(selectedTheme);
      })();
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <script>
      document.body.classList.add(
        document.documentElement.classList.contains("dark") ? "dark" : "light",
      );
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
