<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="/images/zora_design_fav11.png" />

    <!-- Apply the route-specific theme before the first paint -->
    <script>
      (function () {
        const rawPath = window.location.pathname;

        const pathname =
          rawPath === "/" || rawPath.endsWith("/") ? rawPath : `${rawPath}/`;

        const cityPaths = new Set([
          "/webdesign/salzburg/",
          "/en-2/web-design/salzburg/",
          "/webdesign/graz/",
          "/en-2/web-design/graz/",
          "/webdesign/muenchen/",
          "/en-2/web-design/munich/",
        ]);

        const defaultTheme =
          pathname === "/webdesign/salzburg/" ? "dark" : "light";

        const storageKey = cityPaths.has(pathname)
          ? `site-theme:${pathname}`
          : "site-theme";

        const savedTheme = localStorage.getItem(storageKey);

        const selectedTheme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : defaultTheme;

        document.documentElement.classList.add(selectedTheme);
      })();
    </script>

    <!-- Google Analytics: only loads after analytics consent -->
    <script>
      (function () {
        const measurementId = "G-BP3ZTYHMEC";

        let loaded = false;

        /*
         * Disable Google Analytics by default.
         * It will only be enabled after the visitor
         * explicitly allows analytics cookies.
         */
        window["ga-disable-" + measurementId] = true;

        /*
         * Listen for consent changes from the
         * Zora cookie-consent component.
         */
        window.addEventListener("zora:consentchange", function (event) {
          const allowed = event.detail?.analytics === true;

          /*
           * Enable or disable GA depending on consent.
           */
          window["ga-disable-" + measurementId] = !allowed;

          /*
           * If consent was rejected, do nothing else.
           */
          if (!allowed) {
            return;
          }

          /*
           * If Google Analytics has already been loaded,
           * we only need to re-enable it above.
           */
          if (loaded) {
            return;
          }

          loaded = true;

          /*
           * Create Google Analytics dataLayer + gtag.
           */
          window.dataLayer = window.dataLayer || [];

          window.gtag = function () {
            window.dataLayer.push(arguments);
          };

          window.gtag("js", new Date());

          window.gtag("config", measurementId);

          /*
           * Load Google's gtag.js script.
           */
          const script = document.createElement("script");

          script.async = true;

          script.src =
            "https://www.googletagmanager.com/gtag/js?id=" + measurementId;

          document.head.appendChild(script);
        });
      })();
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <script>
      document.body.classList.add(
        document.documentElement.classList.contains("dark") ? "dark" : "light",
      );
    </script>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
